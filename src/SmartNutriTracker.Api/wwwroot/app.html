<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartNutriTracker · Prueba Equipo 4</title>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="lib/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="marca"><span class="logo"><i class="bi bi-flower1"></i></span> SmartNutri</div>
      <nav id="menu"></nav>
      <div class="pie">Versión de prueba · Equipo 4</div>
    </aside>

    <div class="contenido">
      <header class="topbar">
        <button class="btn btn-sm btn-outline-primary menu-movil" id="btn-menu"><i class="bi bi-list"></i></button>
        <h2 id="titulo">Registro diario</h2>
        <div class="acciones">
          <div class="dropdown">
            <button class="btn btn-light d-flex align-items-center gap-2" data-bs-toggle="dropdown">
              <span class="avatar" id="avatar">?</span>
              <span class="text-start d-none d-md-block lh-sm">
                <span class="d-block fw-semibold small" id="nombre-usuario"></span>
                <span class="d-block muted" style="font-size:.72rem" id="rol-usuario"></span>
              </span>
              <i class="bi bi-chevron-down small"></i>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item text-danger" href="#" id="btn-salir"><i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión</a></li>
            </ul>
          </div>
        </div>
      </header>
      <main class="vista" id="vista"></main>
    </div>
  </div>

  <div class="toast-container position-fixed top-0 end-0 p-3" id="toasts"></div>
  <div class="modal fade" id="modal" tabindex="-1"><div class="modal-dialog modal-dialog-scrollable"><div class="modal-content"></div></div></div>

  <script src="lib/bootstrap/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
